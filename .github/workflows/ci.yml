name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Check code style
        run: |
          python -m ruff check .
          python -m ruff format --check .
          npm run format:check
      - name: Test pipeline and regressions
        run: python -m unittest discover -s tests -v
      - name: Build and check synthetic demo
        run: |
          python lecture-to-course/scripts/build_course.py demo/course.json --out demo/site
          python lecture-to-course/scripts/check_site.py demo/site
      - name: Test offline browser interactions
        run: npm run test:browser
